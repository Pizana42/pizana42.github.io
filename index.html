<!doctype html>
<html lang="en">

<head>

<body>
    <h1><button id="theme">
            <svg width="128" height="128" viewBox="0 0 128 128">

                <path id="path2" style="fill:#000000;stroke:#000000;stroke-width:8;stroke-linejoin:round"
